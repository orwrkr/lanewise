name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: run_tests.sh (fake codex and claude, temporary git repo)
        shell: bash
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          bash tests/run_tests.sh

  python38:
    name: Python 3.8 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install vermin
      - run: >
          vermin -t=3.8- --no-tips --violations
          plugins/partitura/bin/orch
          plugins/partitura/lib/orch_core/*.py
          plugins/partitura/adapters/codex
          plugins/partitura/adapters/deepseek
          plugins/partitura/adapters/claude
          plugins/partitura/adapters/_claude_headless.py
